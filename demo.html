<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport"
        content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="x5-orientation" content="portrait">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta content="yes" name="apple-touch-fullscreen">
    <title>自定义倒计时插件演示</title>
    <!-- 引入插件CSS -->
    <link rel="stylesheet" href="dist/customize-countdown.min.css">
    <!-- 引入插件JS -->
    <script src="dist/customize-countdown.min.js"></script>
</head>
<body>
    <h1>倒计时插件演示</h1>
    
    <h2>带数字管效果（手动控制）</h2>
    <div id="wrap1" style="width: 200px; height: 50px;"></div>
    <button id="btn1">开始</button>
    <button id="btn2">暂停</button>
    <button id="btn3">重启</button>
    
    <hr>
    
    <h2>小型数字管效果（自动开始）</h2>
    <div id="wrap2" style="width: 100px; height: 30px;"></div>
    
    <hr>
    
    <h2>大型数字管效果（自动开始）</h2>
    <div id="wrap3" style="width: 500px; height: 80px;"></div>
    
    <hr>
    
    <h2>普通文本显示（带结束回调）</h2>
    <div id="wrap4"></div>
    
    <script src="demo.js"></script>
</body>

</html>
